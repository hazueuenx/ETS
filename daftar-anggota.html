<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pendaftaran Anggota - MyLibrary</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Alata&family=Inter:wght@500;600;700&family=Patrick+Hand&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="form.css" />
  </head>
  <body class="page-form d-flex flex-column min-vh-100">
    <header class="site-header py-3 px-3 px-lg-5">
      <nav
        class="d-flex flex-column flex-lg-row align-items-center gap-3 gap-lg-4"
      >
        <a
          href="/index.html"
          class="brand-logo d-flex flex-column align-items-center justify-content-center text-decoration-none"
        >
          <i class="bi bi-book"></i>
          <span>LibraryReg</span>
        </a>

        <ul
          class="nav flex-column flex-lg-row align-items-center text-center gap-2 gap-lg-3"
        >
          <li class="nav-item">
            <a class="nav-link nav-custom" href="#tentang">Tentang</a>
          </li>
          <li class="nav-item">
            <a class="nav-link nav-custom" href="#layanan">Layanan</a>
          </li>
          <li class="nav-item">
            <a class="nav-link nav-custom" href="/anggota.html"
              >Daftar Anggota</a
            >
          </li>
          <li class="nav-item">
            <a class="nav-link nav-custom" href="/daftar-anggota.html"
              >Pendaftaran Anggota</a
            >
          </li>
          <li class="nav-item">
            <a class="nav-link nav-custom" href="#login">Login</a>
          </li>
        </ul>
      </nav>
    </header>

    <main class="flex-grow-1 d-flex align-items-center py-5">
      <div class="container-xl px-3 px-lg-4">
        <div class="row align-items-center gy-4">
          <section class="col-12 col-lg-5 text-center">
            <h1 class="form-heading mb-4">Bergabung Menjadi Anggota</h1>
            <p class="form-subtext mx-auto mb-0">
              Dapatkan akses ke berbagai koleksi, katalog, e-resource dan
              bergabung ke komunitas perpustakaan
            </p>
          </section>

          <section class="col-12 col-lg-7">
            <form id="form-anggota" class="reg-form" novalidate>
              <div class="row g-3 g-lg-4">
                <div class="col-12 col-lg-6">
                  <label for="nama" class="form-label">Nama Lengkap:</label>
                  <input
                    type="text"
                    class="form-control"
                    id="nama"
                    name="name"
                  />
                </div>

                <div class="col-12 col-lg-6">
                  <label for="nim" class="form-label">NIM/NIP:</label>
                  <input type="text" class="form-control" id="nim" name="nim" />
                </div>

                <div class="col-12 col-lg-6">
                  <label for="email" class="form-label">Email:</label>
                  <input
                    type="email"
                    class="form-control"
                    id="email"
                    name="email"
                  />
                  <span id="error-message" class="error-message"></span>
                </div>

                <div class="col-12 col-lg-6">
                  <label for="telepon" class="form-label">No. Telepon:</label>
                  <input
                    type="tel"
                    class="form-control"
                    id="telepon"
                    name="telepon"
                  />
                </div>

                <div class="col-12 col-lg-6">
                  <label for="prodi" class="form-label">Program Studi:</label>
                  <select class="form-select" id="prodi" name="prodi">
                    <option value="" selected>Pilih Program Studi</option>
                    <option value="Teknik Elektro">Teknik Elektro</option>
                    <option value="Teknik Informatika">
                      Teknik Informatika
                    </option>
                    <option value="Teknik Biomedik">Teknik Biomedik</option>
                    <option value="Sistem Informasi">Sistem Informasi</option>
                    <option value="Teknologi Informasi">
                      Teknologi Informasi
                    </option>
                  </select>
                </div>

                <div class="col-12 col-lg-6">
                  <label for="keanggotaan" class="form-label"
                    >Keanggotaan:</label
                  >
                  <select
                    class="form-select"
                    id="keanggotaan"
                    name="keanggotaan"
                  >
                    <option value="" selected>Pilih Jenis Keanggotaan</option>
                    <option value="Mahasiswa">Mahasiswa</option>
                    <option value="Dosen">Dosen</option>
                    <option value="Tendik">Tenaga Kependidikan</option>
                  </select>
                </div>

                <div class="col-12">
                  <label for="alamat" class="form-label">Alamat:</label>
                  <input
                    type="text"
                    class="form-control"
                    id="alamat"
                    name="alamat"
                  />
                </div>

                <div
                  class="col-12 d-flex justify-content-center justify-content-lg-start gap-3 mt-4"
                >
                  <button type="reset" id="btn-reset" class="btn btn-form">
                    Reset
                  </button>
                  <button type="submit" id="btn-submit" class="btn btn-form">
                    Submit
                  </button>
                </div>
              </div>
            </form>
          </section>
        </div>
      </div>
    </main>

    <footer class="site-footer py-3 px-3 px-lg-4">
      <div
        class="d-flex flex-column flex-lg-row justify-content-lg-between align-items-center gap-1"
      >
        <span>Hubungi: 0878-8341-9700</span>
        <span>Jam Operasional: 09.00 - 18.00</span>
      </div>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
