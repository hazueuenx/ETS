<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Daftar Anggota - MyLibrary</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Alata&family=Inter:wght@500;600;700&family=Patrick+Hand&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="anggota.css" />
  </head>
  <body class="page-list d-flex flex-column min-vh-100">
    <header class="site-header py-3 px-3 px-lg-5">
      <nav
        class="d-flex flex-column flex-lg-row align-items-center gap-3 gap-lg-4"
      >
        <a
          href="/index.html"
          class="brand-logo d-flex flex-column align-items-center justify-content-center text-decoration-none"
        >
          <i class="bi bi-book"></i>
          <span>LibraryReg</span>
        </a>

        <ul
          class="nav flex-column flex-lg-row align-items-center text-center gap-2 gap-lg-3"
        >
          <li class="nav-item">
            <a class="nav-link nav-custom" href="#tentang">Tentang</a>
          </li>
          <li class="nav-item">
            <a class="nav-link nav-custom" href="#layanan">Layanan</a>
          </li>
          <li class="nav-item">
            <a class="nav-link nav-custom" href="/anggota.html"
              >Daftar Anggota</a
            >
          </li>
          <li class="nav-item">
            <a class="nav-link nav-custom" href="/daftar-anggota.html"
              >Pendaftaran Anggota</a
            >
          </li>
          <li class="nav-item">
            <a class="nav-link nav-custom" href="#login">Login</a>
          </li>
        </ul>
      </nav>
    </header>

    <main class="flex-grow-1 py-3 px-3">
      <div class="container-fluid px-0">
        <div class="row g-3">
          <div class="col-12 d-grid d-sm-flex justify-content-sm-end">
            <a
              href="/daftar-anggota.html"
              id="btn-tambah"
              class="btn btn-tambah d-flex align-items-center justify-content-center gap-3"
            >
              <i class="bi bi-plus-lg"></i>
              <span>Tambah Anggota</span>
            </a>
          </div>

          <div class="col-12 col-lg-6">
            <label for="cari" class="visually-hidden"
              >Cari Nama atau NRP/NIP</label
            >
            <div class="search-box position-relative">
              <i class="bi bi-search search-icon"></i>
              <input
                type="search"
                class="form-control"
                id="cari"
                placeholder="Cari Nama atau NRP/NIP"
                autocomplete="on"
              />
            </div>
          </div>

          <div class="col-12 col-sm-6 col-lg-3 offset-lg-0">
            <label for="filter-keanggotaan" class="visually-hidden"
              >Filter jenis keanggotaan</label
            >
            <select class="form-select filter-select" id="filter-keanggotaan">
              <option value="">Semua Jenis Keanggotaan</option>
              <option value="Mahasiswa">Mahasiswa</option>
              <option value="Dosen">Dosen</option>
              <option value="Tendik">Tenaga Kependidikan</option>
            </select>
          </div>

          <div class="col-12 col-sm-6 col-lg-3">
            <label for="filter-prodi" class="visually-hidden"
              >Filter program studi</label
            >
            <select class="form-select filter-select" id="filter-prodi">
              <option value="">Semua Program Studi</option>
              <option value="Teknik Elektro">Teknik Elektro</option>
              <option value="Teknik Informatika">Teknik Informatika</option>
              <option value="Teknik Biomedik">Teknik Biomedik</option>
              <option value="Sistem Informasi">Sistem Informasi</option>
              <option value="Teknologi Informasi">Teknologi Informasi</option>
            </select>
          </div>

          <div class="col-12">
            <div id="member-list" class="table-responsive">
              <table>
                <thead>
                  <tr>
                    <th class="text-center">No</th>
                    <th>NIM/NIP</th>
                    <th>Nama</th>
                    <th>Email</th>
                    <th>No. Telepon</th>
                    <th>Program Studi</th>
                    <th>Jenis</th>
                    <th>Alamat</th>
                    <th class="text-center">Aksi</th>
                  </tr>
                </thead>
                <tbody></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </main>

    <footer class="site-footer py-3 px-3 px-lg-4">
      <div
        class="d-flex flex-column flex-lg-row justify-content-lg-between align-items-center gap-1"
      >
        <span>Hubungi: 0878-8341-9700</span>
        <span>Jam Operasional: 09.00 - 18.00</span>
      </div>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
